[project]
name = "reviewlens"
version = "0.1.0"
description = "Customer feedback analyzer built with LangChain and Streamlit"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM (needs .env); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"reviewlens/emailer.py" = ["E501"]  # inline-styled HTML email markup
